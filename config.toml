[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#060812"
secondaryBackgroundColor = "#0F1527"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"